name: Build Signed Neo APK

on:
  push:
    branches: [neo]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 構建正式簽名 APK
    if: github.ref == 'refs/heads/neo'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      version: ${{ steps.version.outputs.name }}
      apk: ${{ steps.package.outputs.name }}
      sha: ${{ steps.package.outputs.sha }}
      cert: ${{ steps.package.outputs.cert }}
    steps:
      - name: 檢出程式碼
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # AGP 8.7 要求 JDK 17，且与 app/build.gradle.kts 的 jvmTarget 一致
      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 單元測試與 Lint
        run: bash ./gradlew :app:testStandardDebugUnitTest :app:lintStandardDebug --stacktrace

      - name: 计算版本号
        id: version
        run: |
          set -euo pipefail
          BASE=$(sed -n 's/^val appVersionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          test -n "$BASE" || { echo "::error::无法从 app/build.gradle.kts 读取 appVersionName"; exit 1; }
          VERSION="${BASE}.${GITHUB_RUN_NUMBER}"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "本次版本：$VERSION（versionCode = base*10000 + ${GITHUB_RUN_NUMBER}）"

      - name: 建置簽名 APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for secret in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!secret:-}" ]]; then
              echo "::error::Missing Actions secret: $secret"
              exit 1
            fi
          done

          umask 077
          signing_dir=$(mktemp -d "$RUNNER_TEMP/cardeck-signing.XXXXXX")
          trap 'rm -f -- keystore.properties "$signing_dir/release.jks"; rmdir -- "$signing_dir"' EXIT
          export CARDECK_SIGNING_DIR="$signing_dir"

          python3 - <<'PYTHON'
          import base64
          import os
          from pathlib import Path

          keystore = Path(os.environ["CARDECK_SIGNING_DIR"]) / "release.jks"
          encoded = "".join(os.environ["KEYSTORE_BASE64"].split())
          keystore.write_bytes(base64.b64decode(encoded, validate=True))

          def java_property(value):
              # Properties.load(InputStream) interprets backslashes and reads Latin-1.
              units = value.encode("utf-16-be")
              return "".join(r"\u" + units[i:i + 2].hex() for i in range(0, len(units), 2))

          properties = {
              "storeFile": str(keystore),
              "storePassword": os.environ["KEYSTORE_PASSWORD"],
              "keyAlias": os.environ["KEY_ALIAS"],
              "keyPassword": os.environ["KEY_PASSWORD"],
          }
          Path("keystore.properties").write_text(
              "".join(f"{key}={java_property(value)}\n" for key, value in properties.items()),
              encoding="ascii",
          )
          PYTHON

          unset KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD
          bash ./gradlew :app:assembleStandardRelease "-Pcardeck.buildNumber=$BUILD_NUMBER" --stacktrace

      - name: 校验签名并打包
        id: package
        env:
          VERSION: ${{ steps.version.outputs.name }}
          EXPECTED_CERT: ${{ secrets.EXPECTED_CERT_SHA256 }}
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/standard/release/app-standard-release.apk
          test -f "$APK" || { echo "::error::未找到 $APK"; exit 1; }

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER=$(ls "$SDK"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n1)
          test -n "$APKSIGNER" || { echo "::error::找不到 apksigner"; exit 1; }
          "$APKSIGNER" verify --print-certs "$APK" | tee certs.txt

          # 配了 keystore 却仍是 debug 证书 = keystore.properties 没被读到，绝不能放出去
          if grep -q "CN=Android Debug" certs.txt; then
            echo "::error::产物是 debug 签名——正式签名配置没有生效（检查 keystore.properties 与 storeFile 路径）"
            exit 1
          fi
          CERT=$(grep "certificate SHA-256 digest" certs.txt | head -n1 | sed 's/.*digest: //')
          test -n "$CERT" || { echo "::error::读不到签名证书指纹"; exit 1; }

          if [ -n "${EXPECTED_CERT:-}" ]; then
            EXPECTED=$(printf '%s' "$EXPECTED_CERT" | tr -d ': ' | tr 'A-F' 'a-f')
            ACTUAL=$(printf '%s' "$CERT" | tr -d ': ' | tr 'A-F' 'a-f')
            if [ "$EXPECTED" != "$ACTUAL" ]; then
              echo "::error::签名证书与 EXPECTED_CERT_SHA256 不一致：期望 $EXPECTED，实际 $ACTUAL"
              exit 1
            fi
            echo "签名证书与 EXPECTED_CERT_SHA256 一致"
          fi

          NAME="CarDeck-Neo-${VERSION}-release.apk"
          cp "$APK" "$NAME"
          SHA=$(sha256sum "$NAME" | cut -d' ' -f1)
          SIZE=$(du -h "$NAME" | cut -f1)
          {
            echo "name=$NAME"
            echo "sha=$SHA"
            echo "cert=$CERT"
            echo "size=$SIZE"
          } >> "$GITHUB_OUTPUT"
          echo "已生成 $NAME（$SIZE）"

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.name }}
          if-no-files-found: error
          retention-days: 30
          overwrite: 'true' # 重跑同一 run 时版本号不变，覆盖旧产物而不是失败

      - name: 写入运行摘要
        env:
          VERSION: ${{ steps.version.outputs.name }}
          NAME: ${{ steps.package.outputs.name }}
          SHA: ${{ steps.package.outputs.sha }}
          CERT: ${{ steps.package.outputs.cert }}
          SIZE: ${{ steps.package.outputs.size }}
        run: |
          set -euo pipefail
          {
            echo "### CarDeck Neo ${VERSION}（正式签名）"
            echo
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| APK | ${NAME} |"
            echo "| APK 大小 | ${SIZE} |"
            echo "| SHA-256 | ${SHA} |"
            echo "| 签名证书 SHA-256 | ${CERT} |"
            echo
            echo "安装：adb install -r ${NAME}"
            echo
            echo "> Artifacts 列表里显示的体积是**压缩包**大小（dex 在 APK 内不压缩，再打包会缩到约 45%）；"
            echo "> 解压后的 APK 体积见上表。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传测试报告（失败时便于定位）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.sha }}
          path: |
            app/build/reports/tests/**
            app/build/test-results/**
            app/build/reports/lint-results-*
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: 發佈簽名 APK
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下載已驗證的 APK
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.apk }}

      - name: 建立 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          APK: ${{ needs.build.outputs.apk }}
          APK_SHA256: ${{ needs.build.outputs.sha }}
          CERT_SHA256: ${{ needs.build.outputs.cert }}
        run: |
          set -euo pipefail
          printf '%s  %s\n' "$APK_SHA256" "$APK" | sha256sum --check
          TAG="v${VERSION}"
          if gh release view "$TAG" --json isDraft,assets --jq ".isDraft == false and any(.assets[]; .name == \"$APK\")" | grep -qx true; then
            echo "Release $TAG 已發佈"
            exit 0
          fi
          {
            printf '正式簽名 APK：`%s`\n\n' "$APK"
            printf -- '- APK SHA-256：`%s`\n' "$APK_SHA256"
            printf -- '- 簽名憑證 SHA-256：`%s`\n' "$CERT_SHA256"
          } > "$RUNNER_TEMP/release-notes.md"
          gh release create "$TAG" "$APK" --target "$GITHUB_SHA" \
            --title "CarDeck Neo $VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"
